naftiko: 1.0.0-alpha2
info:
  label: WD My Cloud Home API — Search
  description: 'WD My Cloud Home API — Search. 1 operations. Lead operation: Search Files by Parent. Self-contained Naftiko
    capability covering one Western Digital business surface.'
  tags:
  - Western Digital
  - Search
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WESTERN_DIGITAL_API_KEY: WESTERN_DIGITAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: my-cloud-home-search
    baseUri: https://config.mycloud.com
    description: WD My Cloud Home API — Search business capability. Self-contained, no shared references.
    resources:
    - name: sdk-v2-filesSearch-parents
      path: /sdk/v2/filesSearch/parents
      operations:
      - name: searchfilesbyparent
        method: GET
        description: Search Files by Parent
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ids
          in: query
          type: string
          description: Comma-separated list of parent folder IDs to search within. Use "root" for the root folder.
          required: true
        - name: pageToken
          in: query
          type: string
          description: Pagination token.
        - name: limit
          in: query
          type: integer
          description: Maximum number of results.
    authentication:
      type: bearer
      token: '{{env.WESTERN_DIGITAL_API_KEY}}'
  exposes:
  - type: rest
    namespace: my-cloud-home-search-rest
    port: 8080
    description: REST adapter for WD My Cloud Home API — Search. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/sdk/v2/filessearch/parents
      name: sdk-v2-filessearch-parents
      description: REST surface for sdk-v2-filesSearch-parents.
      operations:
      - method: GET
        name: searchfilesbyparent
        description: Search Files by Parent
        call: my-cloud-home-search.searchfilesbyparent
        with:
          ids: rest.ids
          pageToken: rest.pageToken
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: my-cloud-home-search-mcp
    port: 9090
    transport: http
    description: MCP adapter for WD My Cloud Home API — Search. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: search-files-parent
      description: Search Files by Parent
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: my-cloud-home-search.searchfilesbyparent
      with:
        ids: tools.ids
        pageToken: tools.pageToken
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
