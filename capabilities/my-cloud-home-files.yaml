naftiko: 1.0.0-alpha2
info:
  label: WD My Cloud Home API — Files
  description: 'WD My Cloud Home API — Files. 7 operations. Lead operation: List Files. Self-contained Naftiko capability
    covering one Western Digital business surface.'
  tags:
  - Western Digital
  - Files
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WESTERN_DIGITAL_API_KEY: WESTERN_DIGITAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: my-cloud-home-files
    baseUri: https://config.mycloud.com
    description: WD My Cloud Home API — Files business capability. Self-contained, no shared references.
    resources:
    - name: sdk-v2-files
      path: /sdk/v2/files
      operations:
      - name: listfiles
        method: GET
        description: List Files
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ids
          in: query
          type: string
          description: Comma-separated list of file IDs to retrieve.
        - name: pageToken
          in: query
          type: string
          description: Token for pagination to retrieve the next page.
        - name: limit
          in: query
          type: integer
          description: Maximum number of results to return.
      - name: createfile
        method: POST
        description: Create File
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: sdk-v2-files-fileId
      path: /sdk/v2/files/{fileId}
      operations:
      - name: getfile
        method: GET
        description: Get File
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fileId
          in: path
          type: string
          description: Unique identifier of the file or folder.
          required: true
      - name: updatefile
        method: PATCH
        description: Update File
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fileId
          in: path
          type: string
          description: Unique identifier of the file or folder.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletefile
        method: DELETE
        description: Delete File
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fileId
          in: path
          type: string
          description: Unique identifier of the file or folder.
          required: true
    - name: sdk-v2-files-fileId-content
      path: /sdk/v2/files/{fileId}/content
      operations:
      - name: downloadfile
        method: GET
        description: Download File Content
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fileId
          in: path
          type: string
          description: Unique identifier of the file.
          required: true
      - name: uploadfilecontent
        method: PUT
        description: Upload File Content
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fileId
          in: path
          type: string
          description: Unique identifier of the file.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.WESTERN_DIGITAL_API_KEY}}'
  exposes:
  - type: rest
    namespace: my-cloud-home-files-rest
    port: 8080
    description: REST adapter for WD My Cloud Home API — Files. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/sdk/v2/files
      name: sdk-v2-files
      description: REST surface for sdk-v2-files.
      operations:
      - method: GET
        name: listfiles
        description: List Files
        call: my-cloud-home-files.listfiles
        with:
          ids: rest.ids
          pageToken: rest.pageToken
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createfile
        description: Create File
        call: my-cloud-home-files.createfile
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sdk/v2/files/{fileid}
      name: sdk-v2-files-fileid
      description: REST surface for sdk-v2-files-fileId.
      operations:
      - method: GET
        name: getfile
        description: Get File
        call: my-cloud-home-files.getfile
        with:
          fileId: rest.fileId
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatefile
        description: Update File
        call: my-cloud-home-files.updatefile
        with:
          fileId: rest.fileId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletefile
        description: Delete File
        call: my-cloud-home-files.deletefile
        with:
          fileId: rest.fileId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sdk/v2/files/{fileid}/content
      name: sdk-v2-files-fileid-content
      description: REST surface for sdk-v2-files-fileId-content.
      operations:
      - method: GET
        name: downloadfile
        description: Download File Content
        call: my-cloud-home-files.downloadfile
        with:
          fileId: rest.fileId
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: uploadfilecontent
        description: Upload File Content
        call: my-cloud-home-files.uploadfilecontent
        with:
          fileId: rest.fileId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: my-cloud-home-files-mcp
    port: 9090
    transport: http
    description: MCP adapter for WD My Cloud Home API — Files. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-files
      description: List Files
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: my-cloud-home-files.listfiles
      with:
        ids: tools.ids
        pageToken: tools.pageToken
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: create-file
      description: Create File
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: my-cloud-home-files.createfile
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-file
      description: Get File
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: my-cloud-home-files.getfile
      with:
        fileId: tools.fileId
      outputParameters:
      - type: object
        mapping: $.
    - name: update-file
      description: Update File
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: my-cloud-home-files.updatefile
      with:
        fileId: tools.fileId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-file
      description: Delete File
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: my-cloud-home-files.deletefile
      with:
        fileId: tools.fileId
      outputParameters:
      - type: object
        mapping: $.
    - name: download-file-content
      description: Download File Content
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: my-cloud-home-files.downloadfile
      with:
        fileId: tools.fileId
      outputParameters:
      - type: object
        mapping: $.
    - name: upload-file-content
      description: Upload File Content
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: my-cloud-home-files.uploadfilecontent
      with:
        fileId: tools.fileId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
