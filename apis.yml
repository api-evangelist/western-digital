description: >-
  Western Digital is a global leader in data infrastructure, providing storage solutions including hard disk drives,
  solid state drives, flash memory, and data center systems. Their developer program exposes the WD My Cloud Home REST
  API enabling third-party applications to manage files, folders, thumbnails, shares, and user accounts stored on WD My
  Cloud Home devices.
